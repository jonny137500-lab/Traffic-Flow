name: Web checks

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required web files
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check HTML references
        run: |
          grep -q 'href="style.css"' index.html
          grep -q 'src="game.js"' index.html
